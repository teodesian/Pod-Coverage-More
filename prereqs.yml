# Read by [PrereqsFile] in dist.ini, for prerequisites [AutoPrereqs] cannot find
# in the code.  The perl floor is here as well as on the use line of every file,
# so the metadata states it even where one file leaves that line out.
runtime:
  requires:
    perl: '5.036'
    # Pod::Weaver::Section::Blurbs is a Moose class that consumes a role of Pod::Weaver,
    # named in a string, which AutoPrereqs cannot see; dist.ini skips Moose for the fixtures.
    Moose: '0'
    Pod::Weaver: '4'
test:
  recommends:
    Moose: '0'
    Moo: '0'
    Mouse: '0'
    Class::Tiny: '0'
    Function::Parameters: '0'
    Kavorka: '0'
    Object::Pad: '0'
    Method::Signatures: '0'
